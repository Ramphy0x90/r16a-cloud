name: Build & Deploy R16a Cloud backend

on:
    push:
        branches: [main]

jobs:
    build-and-deploy:
        runs-on: self-hosted
        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            # TODO: Create and run tests
            #- name: Run tests
            #  run: ./gradlew test

            - name: Login private registry
              run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.r16a.cloud -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

            - name: Build and push Docker image
              run: |
                  docker build -t registry.r16a.cloud/r16a-cloud:${{ github.sha }} -t registry.r16a.cloud/r16a-cloud:latest .
                  docker push registry.r16a.cloud/r16a-cloud:${{ github.sha }}
                  docker push registry.r16a.cloud/r16a-cloud:latest

            - name: Deploy in kubernetes
              run: |
                  kubectl set image deployment/r16a-cloud r16a-cloud=registry.r16a.cloud/r16a-cloud:${{ github.sha }} -n r16a-cloud
                  kubectl rollout status deployment/r16a-cloud -n r16a-cloud --timeout=120s
