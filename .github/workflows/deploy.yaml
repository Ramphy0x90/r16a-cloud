name: Build & Deploy R16a Cloud backend

on:
    push:
        branches: [main]

jobs:
    test:
        runs-on: self-hosted

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Run tests
              run: ./gradlew test

            - name: Upload test report
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: test-report
                  path: build/reports/tests/test/

    security:
        runs-on: self-hosted

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: SAST - SpotBugs + Find Security Bugs
              run: ./gradlew spotbugsMain

            - name: Upload SpotBugs report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: spotbugs-report
                  path: build/reports/spotbugs/

            - name: OWASP Dependency Check
              uses: dependency-check/Dependency-Check_Action@main
              with:
                  project: "r16a-cloud"
                  path: "."
                  format: "HTML"
                  args: >
                      --failOnCVSS 7
                      --enableRetired
              env:
                  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

            - name: Upload OWASP report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: owasp-report
                  path: reports/

            - name: Trivy filesystem scan
              uses: aquasecurity/trivy-action@master
              with:
                  scan-type: "fs"
                  scan-ref: "."
                  severity: "CRITICAL,HIGH"
                  exit-code: "1"
                  format: "table"

    build-and-deploy:
        needs: [test, security]
        runs-on: self-hosted
        environment: Deploy
        env:
            KUBECONFIG: /home/r16a-runner/.kube/config

        steps:
            - uses: actions/checkout@v4

            - name: Login private registry
              run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login registry.r16a.cloud -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin

            - name: Build and push Docker image
              run: |
                  docker build -t registry.r16a.cloud/r16a-cloud:${{ github.sha }} -t registry.r16a.cloud/r16a-cloud:latest .
                  docker push registry.r16a.cloud/r16a-cloud:${{ github.sha }}
                  docker push registry.r16a.cloud/r16a-cloud:latest

            - name: Update deployment image in manifest
              run: |
                  sed -i "s|image: registry.r16a.cloud/r16a-cloud:.*|image: registry.r16a.cloud/r16a-cloud:${{ github.sha }}|" k8s/deployment.yaml

            - name: Apply Kubernetes manifests
              run: |
                  kubectl apply -f k8s/
                  kubectl rollout status deployment/r16a-cloud -n r16a-cloud --timeout=120s
