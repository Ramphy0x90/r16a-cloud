spring.application.name=r16a-cloud

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/r16a_cloud}
spring.datasource.username=${DB_USERNAME:r16a}
spring.datasource.password=${DB_PASSWORD:r16a_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=update

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# OAuth2
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:https://auth.r16a.cloud/application/o/r16a-cloud-local/}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWKS_URI:https://auth.r16a.cloud/application/o/r16a-cloud-local/jwks/}

# File upload (override via MULTIPART_MAX_FILE_SIZE / MULTIPART_MAX_REQUEST_SIZE in production)
# Reverse proxies: raise client_max_body_size (nginx) or equivalent, and read/send timeouts for long uploads.
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10GB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10GB}
app.upload.path=${UPLOAD_PATH:./app/uploads}
app.upload.chunk-default-part-size-bytes=${CHUNK_DEFAULT_PART_SIZE_BYTES:8388608}
app.upload.chunk-min-part-size-bytes=${CHUNK_MIN_PART_SIZE_BYTES:1048576}
app.upload.chunk-max-part-size-bytes=${CHUNK_MAX_PART_SIZE_BYTES:67108864}
app.upload.chunk-session-ttl-hours=${CHUNK_SESSION_TTL_HOURS:48}
app.upload.chunk-cleanup-interval-ms=${CHUNK_CLEANUP_INTERVAL_MS:3600000}
app.download.token-secret=${DOWNLOAD_TOKEN_SECRET:r16a-default-change-in-production}
